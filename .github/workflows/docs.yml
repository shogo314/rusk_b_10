name: Documentation

on:
  push:
    branches: [main]
    paths: ['docs/**', 'lib/**', 'src/**', 'tests/api.rs', 'tests/test_mkdocs_api.py', 'tools/mkdocs_api.py', 'Cargo.*', 'build.rs', 'rusk.par', 'mkdocs.yml', 'requirements-docs.txt', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'lib/**', 'src/**', 'tests/api.rs', 'tests/test_mkdocs_api.py', 'tools/mkdocs_api.py', 'Cargo.*', 'build.rs', 'rusk.par', 'mkdocs.yml', 'requirements-docs.txt', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install -r requirements-docs.txt
      - run: cargo test --locked --test api
      - run: python -m unittest discover -s tests -p test_mkdocs_api.py
      - run: python -m mkdocs build --strict
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    concurrency:
      group: github-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
