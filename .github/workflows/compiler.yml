name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-verify.txt
      - run: python -m pip install -r requirements-verify.txt
      - uses: actions/cache@v4
        with:
          path: |
            .verify-helper/cache
            ~/.cache/online-judge-tools/library-checker-problems
          key: public-judge-${{ runner.os }}-${{ hashFiles('requirements-verify.txt', 'examples/aoj/**', 'examples/library_checker/**') }}
          restore-keys: public-judge-${{ runner.os }}-
      - run: python3 tools/test.py
